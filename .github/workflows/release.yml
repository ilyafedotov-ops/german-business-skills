name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  build:
    needs: [checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate exact tag and build twice
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -B tools/release.py prepare --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-assets"
          python -B tools/release.py prepare --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-repeat"
          diff -r "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/release-repeat"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # No checkout or project-code execution in this privileged job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gui-release-*
          path: gui-assets
          merge-multiple: true
      - name: Verify native application archives
        shell: bash
        run: |
          set -euo pipefail
          cd gui-assets
          shopt -s nullglob
          sums=(*.sha256)
          [[ ${#sums[@]} -eq 3 ]]
          for sum in "${sums[@]}"; do sha256sum --check --strict "$sum"; done
          # Copy only named build outputs; execute no application/project code here.
          files=(de-business-kit-*-gui-windows-x64.zip de-business-kit-*-gui-macos-arm64.tar.gz de-business-kit-*-gui-macos-x86_64.tar.gz)
          [[ ${#files[@]} -eq 3 ]]
          [[ $(find . -maxdepth 1 -type f | wc -l) -eq 6 ]]
          for file in "${files[@]}"; do
            cp -- "$file" ../release-assets/
            sha256sum "$file" >> ../release-assets/SHA256SUMS
          done
      - name: Check downloaded bytes
        working-directory: release-assets
        run: sha256sum --check --strict SHA256SUMS
      - name: Sign build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*
      - name: Verify provenance and publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh --version
          # GitHub may publish the immutable release before its proof is readable.
          # Retry verification only; a missing/invalid proof still fails closed.
          verify_with_retry() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then return 0; fi
              if [[ "$attempt" -lt 6 ]]; then sleep 10; fi
            done
            return 1
          }
          for asset in release-assets/*; do
            verify_with_retry gh attestation verify "$asset" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$SOURCE_SHA" \
              --deny-self-hosted-runners
          done
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
            --title "German Business Kit $RELEASE_TAG" \
            --notes-file release-assets/release-notes.md "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
          # The settings endpoint requires admin permissions, unavailable to
          # GITHUB_TOKEN. The published release exposes this enforced outcome.
          test "$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .immutable)" = true
          verify_with_retry gh release verify "$RELEASE_TAG"
