name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      force_full:
        type: boolean
        default: true
        description: Reusable release checks build and validate every platform.

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      mode: ${{ steps.plan.outputs.mode }}
      tree: ${{ steps.plan.outputs.tree }}
      pr: ${{ steps.plan.outputs.pr }}
      reused_run: ${{ steps.plan.outputs.reused_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Select coverage or verify prior PR tree
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FORCE_FULL: ${{ inputs.force_full || github.ref_type == 'tag' }}
        run: python3 -B tools/ci_plan.py plan

  quick:
    name: Package, metadata and documentation
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate selection guards, portable packages and release metadata
        run: |
          python -B -m unittest discover -s tests -p test_ci_plan.py -v
          python -B -m unittest discover -s tests -p test_doc_links.py -v
          python -B -m unittest discover -s tests -p test_packaging.py -v
          python -B -m unittest discover -s tests -p 'test_releas*.py' -v
          python -B tools/release.py check
          python -B tools/ci_plan.py pin
          python -B tools/check_package.py
          python -B tools/check_doc_links.py
          git show --format= --check HEAD

  browser:
    name: Browser pages / ${{ matrix.os }} / ${{ matrix.browser }}
    needs: plan
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx playwright install ${{ matrix.browser }}
      - run: npm run test:csp -- --browser=${{ matrix.browser }}
      - run: npm run test:documents -- --browser=${{ matrix.browser }}
      - run: npm run test:overview -- --browser=${{ matrix.browser }}
      - run: npm run test:installer -- --browser=${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            output/installer/
            output/document-template/
            output/overview/

  native-utilities:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}${{ matrix.shard && format(' / tests {0}', matrix.shard) || '' }}
    needs: plan
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python has no macOS ARM64 build for Python 3.9.
          - os: macos-latest
            python: '3.10'
          - os: macos-latest
            python: '3.14'
          # Windows filesystem calls are slow; split each version's tests in two.
          - os: windows-latest
            python: '3.9'
            shard: '1/2'
          - os: windows-latest
            python: '3.9'
            shard: '2/2'
          - os: windows-latest
            python: '3.14'
            shard: '1/2'
          - os: windows-latest
            python: '3.14'
            shard: '2/2'
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test offline workspace, installer and extracted packages
        run: python -B tools/ci_plan.py tests ${{ matrix.shard || 'all' }}
      - name: Check release version contract
        run: python -B tools/release.py check
      - name: Validate package structure and local references
        run: python -B tools/check_package.py

  windows-without-python:
    name: Windows PowerShell 5.1 / no Python setup
    needs: plan
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Native install, start, preview, intake, resume and integrity
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          & .\tests\native\windows-smoke.ps1
          & .\tests\native\overview-smoke.ps1
          & .\tests\native\recovery-smoke.ps1

  gate:
    name: Checks gate
    if: always()
    needs: [plan, quick, browser, native-utilities, windows-without-python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate required results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B tools/ci_plan.py gate
      # This successful step is the evidence consumed by a later main push.
      # Never emit it before all required results have passed the gate above.
      - name: Validated PR / ${{ needs.plan.outputs.pr }} / ${{ needs.plan.outputs.mode }} / ${{ needs.plan.outputs.tree }}
        run: echo 'Required checks passed for the selected checkout tree.'
