name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prototype:
    name: Prototype / ${{ matrix.os }} / ${{ matrix.browser }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx playwright install ${{ matrix.browser }}
      - run: npm test
      - run: npm run test:browser -- --browser=${{ matrix.browser }}
      - run: npm run test:documents -- --browser=${{ matrix.browser }}
      - run: npm run test:overview -- --browser=${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: prototype-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            output/prototype/
            output/document-template/
            output/overview/

  native-utilities:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python has no macOS ARM64 build for Python 3.9.
          - os: macos-latest
            python: '3.10'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.9'
          - os: windows-latest
            python: '3.14'
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test offline workspace, installer and extracted packages
        run: python -B -m unittest discover -s tests -v
      - name: Check release version contract
        run: python -B tools/release.py check
      - name: Validate package structure and local references
        run: python -B tools/check_package.py

  windows-without-python:
    name: Windows PowerShell 5.1 / no Python setup
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Native install, start, preview, intake, resume and integrity
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          & .\tests\native\windows-smoke.ps1
          & .\tests\native\overview-smoke.ps1
          & .\tests\native\recovery-smoke.ps1
