<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..800&display=block" rel="stylesheet">
<link rel="stylesheet" href="receipt.css">
<style>
  body { width: 1280px; height: 720px; overflow: hidden; }
  .thumb { position: relative; width: 1280px; height: 720px; }
  .head { position: absolute; left: 64px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; color: #fff; }
  .head .dh { font-size: 96px; color: #fff; line-height: 1.02; }
  .head .sub { margin-top: 26px; font-size: 26px; white-space: nowrap; color: var(--carbon-ink); font-variation-settings: 'wdth' 87.5; font-weight: 600; }
  .head .sub b { color: #fff; background: var(--red); padding: 2px 10px 4px; }
  .rec { position: absolute; left: 706px; top: 96px; width: 520px; transform: rotate(4deg); }
  .rec .t { font-size: 30px; } .rec .dw { font-size: 52px; } .rec .row.dw { font-size: 42px; } .rec .lbl { font-size: 22px; }
</style>
</head>
<body>
<div class="thumb R">
  <div class="head"><div class="dh">Every answer comes with its receipt.</div><div class="sub">German Business Kit · <b>walkthrough</b></div></div>
  <div class="lift rec"><div class="receipt white">
    <div class="dw" style="font-size:44px">FREIBERUFLER?</div>
    <div class="rule"></div>
    <div class="row t"><span class="k">§18 EStG</span><span class="dots"></span><span class="v">OK</span></div>
    <div class="row t"><span class="k">§138 AO</span><span class="dots"></span><span class="v">OK</span></div>
    <div class="row t"><span class="k">§19 UStG</span><span class="dots"></span><span class="v">OK</span></div>
    <div class="row t"><span class="k">§37 EStG</span><span class="dots"></span><span class="v">OK</span></div>
    <div class="rule dbl"></div>
    <div class="row dw"><span class="k">SENT BY</span><span class="dots"></span><span class="v red">YOU</span></div>
  </div></div>
</div>
</body>
</html>
