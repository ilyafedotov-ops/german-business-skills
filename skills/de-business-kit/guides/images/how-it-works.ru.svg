<svg xmlns="http://www.w3.org/2000/svg" width="760" height="704" viewBox="0 0 760 704" role="img" aria-labelledby="title desc" xml:lang="ru">
<title id="title">Ваш ассистент. Ваша папка бизнеса.</title>
<desc id="desc">Работайте в Claude или Codex. Без отдельного GUI. Попросите своими словами: Используй de-business-kit. Подготовь предложение по согласованным условиям. Уточните и подготовьте: Ассистент учтёт факты и спросит недостающее. Вы получите черновик и следующий шаг. Сохраните и продолжите: Для постоянной работы выберите свою папку. В ней — результаты, факты и открытые вопросы. Схема работы. Для простого вопроса папка не нужна.</desc>
<rect width="760" height="704" rx="24" fill="#f7f5ef"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#173e4b">
<text x="32" y="47" font-size="19" font-weight="700" fill="#173e4b">GERMAN BUSINESS KIT</text>
<text x="32" y="92" font-size="34" font-weight="700" fill="#173e4b">Ваш ассистент. Ваша папка бизнеса.</text>
<text x="32" y="128" font-size="24" font-weight="400" fill="#173e4b">Работайте в Claude или Codex. Без отдельного GUI.</text>
<rect x="32" y="158" width="696" height="134" rx="16" fill="#ddece8"/>
<circle cx="66" cy="194" r="18" fill="#173e4b"/>
<text x="60" y="201" font-size="22" font-weight="700" fill="#ffffff">1</text>
<text x="100" y="201" font-size="28" font-weight="700" fill="#173e4b">Попросите своими словами</text>
<text x="100" y="236" font-size="25" font-weight="400" fill="#173e4b">Используй de-business-kit. Подготовь</text>
<text x="100" y="268" font-size="25" font-weight="400" fill="#173e4b">предложение по согласованным условиям.</text>
<path d="M66 298 v12 m-5 -5 5 5 5 -5" fill="none" stroke="#173e4b" stroke-width="2"/>
<rect x="32" y="316" width="696" height="134" rx="16" fill="#f6ddcd"/>
<circle cx="66" cy="352" r="18" fill="#173e4b"/>
<text x="60" y="359" font-size="22" font-weight="700" fill="#ffffff">2</text>
<text x="100" y="359" font-size="28" font-weight="700" fill="#173e4b">Уточните и подготовьте</text>
<text x="100" y="394" font-size="25" font-weight="400" fill="#173e4b">Ассистент учтёт факты и спросит недостающее.</text>
<text x="100" y="426" font-size="25" font-weight="400" fill="#173e4b">Вы получите черновик и следующий шаг.</text>
<path d="M66 456 v12 m-5 -5 5 5 5 -5" fill="none" stroke="#173e4b" stroke-width="2"/>
<rect x="32" y="474" width="696" height="134" rx="16" fill="#e1e8ef"/>
<circle cx="66" cy="510" r="18" fill="#173e4b"/>
<text x="60" y="517" font-size="22" font-weight="700" fill="#ffffff">3</text>
<text x="100" y="517" font-size="28" font-weight="700" fill="#173e4b">Сохраните и продолжите</text>
<text x="100" y="552" font-size="25" font-weight="400" fill="#173e4b">Для постоянной работы выберите свою папку.</text>
<text x="100" y="584" font-size="25" font-weight="400" fill="#173e4b">В ней — результаты, факты и открытые вопросы.</text>
<text x="32" y="659" font-size="22" font-weight="400" fill="#173e4b">Схема работы. Для простого вопроса папка не нужна.</text>
</g></svg>
