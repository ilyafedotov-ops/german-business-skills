<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc" xml:lang="ru">
<title id="title">Ваш первый полезный ответ</title><desc id="desc">Одно приложение. Один проект. Семь связанных скиллов. Откройте помощника; Codex или Claude Code; Выберите локальный проект. Добавьте весь набор; Все семь папок скиллов; Начните новый разговор. Задайте один вопрос; Вымышленный пример; Один небольшой следующий шаг. Позже: сохраняйте записи бизнеса в отдельной приватной папке.</desc>
<rect width="1080" height="380" rx="24" fill="#f7f5ef"/>
<g font-family="Arial, sans-serif" fill="#173e4b">
<text x="32" y="48" font-size="28" font-weight="700">Ваш первый полезный ответ</text>
<text x="32" y="80" font-size="18">Одно приложение. Один проект. Семь связанных скиллов.</text>
<rect x="32" y="112" width="328" height="180" rx="18" fill="#ddece8"/>
<circle cx="62" cy="145" r="16" fill="#173e4b"/>
<text x="62" y="151" text-anchor="middle" fill="white" font-size="17" font-weight="700">1</text>
<text x="50" y="193" font-size="22" font-weight="700">Откройте помощника</text>
<text x="50" y="229" font-size="18">Codex или Claude Code</text>
<text x="50" y="259" font-size="17">Выберите локальный проект</text>
<rect x="376" y="112" width="328" height="180" rx="18" fill="#f6ddcd"/>
<circle cx="406" cy="145" r="16" fill="#173e4b"/>
<text x="406" y="151" text-anchor="middle" fill="white" font-size="17" font-weight="700">2</text>
<text x="394" y="193" font-size="22" font-weight="700">Добавьте весь набор</text>
<text x="394" y="229" font-size="18">Все семь папок скиллов</text>
<text x="394" y="259" font-size="17">Начните новый разговор</text>
<rect x="720" y="112" width="328" height="180" rx="18" fill="#e1e8ef"/>
<circle cx="750" cy="145" r="16" fill="#173e4b"/>
<text x="750" y="151" text-anchor="middle" fill="white" font-size="17" font-weight="700">3</text>
<text x="738" y="193" font-size="22" font-weight="700">Задайте один вопрос</text>
<text x="738" y="229" font-size="18">Вымышленный пример</text>
<text x="738" y="259" font-size="17">Один небольшой следующий шаг</text>
<text x="32" y="342" font-size="19">Позже: сохраняйте записи бизнеса в отдельной приватной папке.</text>
</g></svg>
