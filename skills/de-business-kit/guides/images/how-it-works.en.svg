<svg xmlns="http://www.w3.org/2000/svg" width="760" height="704" viewBox="0 0 760 704" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Your assistant. Your business folder.</title>
<desc id="desc">Work in Claude or Codex. No separate app needed. Ask in your own words: Use de-business-kit. Help me prepare a proposal from these agreed terms. Clarify, then prepare: Reuse confirmed facts. Ask for missing details. Get a readable draft and the next action. Save and continue: For ongoing work, use your private folder. Keep results, confirmed facts and open questions. Workflow illustration. A simple question needs no folder.</desc>
