<svg xmlns="http://www.w3.org/2000/svg" width="760" height="704" viewBox="0 0 760 704" role="img" aria-labelledby="title desc" xml:lang="de">
<title id="title">Installation und erste Aufgabe</title>
<desc id="desc">Installation und erste Aufgabe Beginnen Sie mit der Anfrage aus dieser Anleitung. Assistenten installieren lassen Repository-Link und Anfrage einfügen. Der Assistent prüft den Weg für Ihre App. Schritte für Ihre App befolgen Claude: Marketplace und Plugin hinzufügen. Codex: ganzes Kit ins Projekt kopieren. In neuer Aufgabe oder neuem Chat prüfen Alle sieben Skills sollten verfügbar sein. Nutze de-business-kit. Zeig eine kleine Aufgabe. Ablauf der Installation, kein App-Screenshot.</desc>
<rect width="760" height="704" rx="24" fill="#f7f5ef"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#173e4b">
<text x="32" y="47" font-size="19" font-weight="700" fill="#173e4b">GERMAN BUSINESS KIT</text>
<text x="32" y="92" font-size="34" font-weight="700" fill="#173e4b">Installation und erste Aufgabe</text>
<text x="32" y="128" font-size="24" font-weight="400" fill="#173e4b">Beginnen Sie mit der Anfrage aus dieser Anleitung.</text>
<rect x="32" y="158" width="696" height="134" rx="16" fill="#ddece8"/>
<circle cx="66" cy="194" r="18" fill="#173e4b"/>
<text x="60" y="201" font-size="22" font-weight="700" fill="#ffffff">1</text>
<text x="100" y="201" font-size="28" font-weight="700" fill="#173e4b">Assistenten installieren lassen</text>
<text x="100" y="236" font-size="25" font-weight="400" fill="#173e4b">Repository-Link und Anfrage einfügen.</text>
<text x="100" y="268" font-size="25" font-weight="400" fill="#173e4b">Der Assistent prüft den Weg für Ihre App.</text>
<path d="M66 298 v12 m-5 -5 5 5 5 -5" fill="none" stroke="#173e4b" stroke-width="2"/>
<rect x="32" y="316" width="696" height="134" rx="16" fill="#f6ddcd"/>
<circle cx="66" cy="352" r="18" fill="#173e4b"/>
<text x="60" y="359" font-size="22" font-weight="700" fill="#ffffff">2</text>
<text x="100" y="359" font-size="28" font-weight="700" fill="#173e4b">Schritte für Ihre App befolgen</text>
<text x="100" y="394" font-size="25" font-weight="400" fill="#173e4b">Claude: Marketplace und Plugin hinzufügen.</text>
<text x="100" y="426" font-size="25" font-weight="400" fill="#173e4b">Codex: ganzes Kit ins Projekt kopieren.</text>
<path d="M66 456 v12 m-5 -5 5 5 5 -5" fill="none" stroke="#173e4b" stroke-width="2"/>
<rect x="32" y="474" width="696" height="134" rx="16" fill="#e1e8ef"/>
<circle cx="66" cy="510" r="18" fill="#173e4b"/>
<text x="60" y="517" font-size="22" font-weight="700" fill="#ffffff">3</text>
<text x="100" y="517" font-size="28" font-weight="700" fill="#173e4b">In neuer Aufgabe oder neuem Chat prüfen</text>
<text x="100" y="552" font-size="25" font-weight="400" fill="#173e4b">Alle sieben Skills sollten verfügbar sein.</text>
<text x="100" y="584" font-size="25" font-weight="400" fill="#173e4b">Nutze de-business-kit. Zeig eine kleine Aufgabe.</text>
<text x="32" y="659" font-size="22" font-weight="400" fill="#173e4b">Ablauf der Installation, kein App-Screenshot.</text>
